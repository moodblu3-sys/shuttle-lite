# Shuttle Lite の明示的proxy検証用 Squid 設定
#
# 目的は「必要な宛先だけをproxy経由で通し、それ以外は拒否する」状態を再現し、
# direct接続へfallbackしていないことをaccess logで証明することである。

# ---------------------------------------------------------------------------
# Basic認証 (MVPのproxy認証は none または Basic のみ。NTLM/Kerberosは対象外)
# ---------------------------------------------------------------------------
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic realm Shuttle Lite proxy
auth_param basic children 5
auth_param basic credentialsttl 1 hour

acl authenticated proxy_auth REQUIRED

# ---------------------------------------------------------------------------
# 宛先allowlist
# ---------------------------------------------------------------------------
acl box_api dstdomain .box.com
acl box_upload dstdomain upload.box.com
acl box_download dstdomain dl.boxcloud.com .boxcloud.com
acl snowflake dstdomain .snowflakecomputing.com

acl ssl_ports port 443
acl safe_ports port 80 443
acl CONNECT method CONNECT

http_access deny !safe_ports
http_access deny CONNECT !ssl_ports

# 認証済みのrequestのうち、allowlistされた宛先だけを通す
http_access allow authenticated box_api
http_access allow authenticated box_upload
http_access allow authenticated box_download
http_access allow authenticated snowflake

# それ以外はすべて拒否する。403で落ちることがallowlistの証明になる
http_access deny all

http_port 3128

# ---------------------------------------------------------------------------
# Log
# ---------------------------------------------------------------------------
# 経路の証明に使うので、要求ごとに1行出す
#
# 既定の squid formatはclientへ返したbyteしか出さない。移行は上り方向が
# 主役なので、up/downの両方を出す独自formatを使う。squid.local.conf.template
# と同じ書式にして、Dockerの有無で証跡の見え方が変わらないようにする。
logformat shuttle %ts.%03tu %>a %Ss/%03>Hs %rm %ru user=%[un up=%>st down=%<st %Sh/%<a
access_log stdio:/var/log/squid/access.log shuttle
cache_log /var/log/squid/cache.log

# 移行の測定を歪めないよう、cacheは無効化する
cache deny all

# Client情報をBoxへ渡さない
forwarded_for delete

# 実行端末のhostnameをlogやerror pageへ出さない
visible_hostname shuttle-lite-proxy

shutdown_lifetime 5 seconds
